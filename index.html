<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reserva Hotel Canino</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; }
    .search-box { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto 20px auto; }
    .card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; gap: 15px; }
    .card img { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; }
    .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    .status-msg { text-align: center; font-weight: bold; margin: 15px 0; color: #555; }
    .error-msg { color: red; text-align: center; }
  </style>
</head>
<body>

<div class="search-box">
  <h2>Buscar Hotel Canino</h2>
  <label>Pueblo / Ubicación:</label>
  <input type="text" id="pueblo" value="Soto del Real" style="width:90%; margin-bottom:10px;"><br>
  <label>Entrada:</label>
  <input type="date" id="fInicio">
  <label>Salida:</label>
  <input type="date" id="fFin"><br><br>
  <button class="btn" onclick="buscarHoteles()">Buscar Disponibilidad</button>
</div>

<div id="resultados" style="max-width:600px; margin:0 auto;"></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyHwYbbiMapyXQRGCm0bFutAgTAg3L-JynYgihn0sb6KVWyb8FGMh_LT3cc789qTaulTw/exec";

  async function buscarHoteles() {
    const pueblo = document.getElementById('pueblo').value;
    const fInicio = document.getElementById('fInicio').value;
    const fFin = document.getElementById('fFin').value;
    const contenedor = document.getElementById('resultados');
    
    if(!fInicio || !fFin) { 
      alert("Por favor, selecciona las fechas de entrada y salida."); 
      return; 
    }

    // Feedback visual inmediato al hacer clic
    contenedor.innerHTML = '<div class="status-msg">🔍 Consultando disponibilidad y distancias...</div>';

    try {
      const res = await fetch(`${API_URL}?pueblo=${encodeURIComponent(pueblo)}&fechaInicio=${fInicio}&fechaFin=${fFin}`);
      
      if (!res.ok) throw new Error("Error en la respuesta del servidor");
      
      const hoteles = await res.json();
      
      if (!Array.isArray(hoteles) || hoteles.length === 0) {
        contenedor.innerHTML = '<div class="status-msg">No se encontraron hoteles disponibles.</div>';
        return;
      }

      // Ordenar protegiendo valores "N/A" o no numéricos
      hoteles.sort((a, b) => {
        const distA = typeof a.distanciaKM === 'number' ? a.distanciaKM : 9999;
        const distB = typeof b.distanciaKM === 'number' ? b.distanciaKM : 9999;
        return distA - distB;
      });

      let html = "";
      hoteles.forEach(h => {
        const distTexto = typeof h.distanciaKM === 'number' ? `${h.distanciaKM} km` : 'Distancia N/D';
        const plazasTexto = (h.plazasLibres && h.plazasLibres.length > 0) ? h.plazasLibres.join(", ") : "Sin disponibilidad";
        
        html += `
          <div class="card">
            <img src="${h.urlImagen || 'https://via.placeholder.com/120'}" alt="${h.hotel}">
            <div>
              <h3>${h.hotel} (${distTexto})</h3>
              <p>${h.descripcion}</p>
              <p><strong>Precio:</strong> ${h.precioNoche}€ / noche</p>
              <p><strong>Plazas Libres:</strong> ${plazasTexto}</p>
              ${(h.plazasLibres && h.plazasLibres.length > 0) ? `<button class="btn" onclick="reservar('${h.hotel}', '${h.plazasLibres[0]}', '${h.precioNoche}', '${h.enlaceStripe}')">Reservar Plaza</button>` : ''}
            </div>
          </div>`;
      });
      contenedor.innerHTML = html;

    } catch (error) {
      console.error(error);
      contenedor.innerHTML = `<div class="status-msg error-msg">❌ Error al conectar con el servidor. Revisa los permisos de Apps Script o inténtalo de nuevo.</div>`;
    }
  }

  function reservar(hotel, plaza, precio, stripeUrl) {
    const metodo = prompt("Selecciona método de pago: escribe 'tarjeta' o 'bizum'");
    if(!metodo) return;

    const datos = {
      hotel: hotel,
      plaza: plaza,
      nombre: "Usuario Prueba",
      telefono: "600000000",
      email: "cliente@prueba.com",
      fechaInicio: document.getElementById('fInicio').value,
      fechaFin: document.getElementById('fFin').value,
      metodoPago: metodo.toLowerCase()
    };

    fetch(API_URL, { method: 'POST', body: JSON.stringify(datos) })
      .then(() => {
        if(metodo.toLowerCase() === 'tarjeta') {
          window.location.href = stripeUrl;
        } else {
          alert("Reserva registrada en estado Pendiente. Sigue las instrucciones enviadas a tu email.");
        }
      });
  }
</script>
</body>
</html>
